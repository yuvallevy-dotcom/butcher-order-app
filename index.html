<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>הזמנות סחורה — קצביה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F3EF;
    --surface:#FFFFFF;
    --ink:#211D1A;
    --ink-soft:#79726A;
    --border:#E6E1D8;
    --accent:#A32638;
    --accent-dark:#7C1C2A;
    --accent-soft:#F6E4E6;
    --wood:#C9A574;
    --success:#3F7A5C;
    --success-soft:#E7F0EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Rubik',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--surface);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,0.06);
  }
  @media (min-width:520px){
    body{padding:24px 0;}
    .app-shell{min-height:calc(100vh - 48px);border-radius:20px;overflow:hidden;}
  }

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
  }
  .topbar .back{
    width:38px;height:38px;flex:none;
    border-radius:50%;
    border:1.5px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
    font-size:18px;
    -webkit-tap-highlight-color:transparent;
  }
  .topbar .back:active{background:var(--bg);}
  .topbar h1{font-size:18px;margin:0;font-weight:700;flex:1;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;font-weight:500;}

  .brand{
    display:flex;align-items:center;gap:10px;padding:22px 18px 6px;
  }
  .brand svg{width:34px;height:34px;flex:none;}
  .brand .name{font-family:'Rubik';font-weight:800;font-size:20px;}
  .brand .tag{font-size:12px;color:var(--ink-soft);font-weight:500;}

  .content{flex:1;padding:16px 18px 100px;}
  .content.no-pad-bottom{padding-bottom:16px;}

  /* Buttons */
  .btn{
    font-family:'Heebo';
    font-weight:700;
    font-size:16px;
    border-radius:14px;
    padding:15px 18px;
    border:none;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .05s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:#D8CFC8;color:#a39c93;cursor:not-allowed;}
  .btn-secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--accent);font-weight:700;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}

  /* Big tile choice (home) */
  .tile{
    display:flex;align-items:center;gap:16px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tile:active{background:var(--bg);}
  .tile .icon{
    width:52px;height:52px;border-radius:14px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
  }
  .tile.order .icon{background:var(--accent-soft);color:var(--accent);}
  .tile.admin .icon{background:#F1EBDD;color:var(--wood);}
  .tile.history .icon{background:var(--success-soft);color:var(--success);}
  .tile .t{font-weight:700;font-size:16px;}
  .tile .d{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .tile .arrow{margin-right:auto;color:var(--ink-soft);font-size:18px;}

  /* Step indicator */
  .steps{display:flex;flex-direction:row-reverse;gap:6px;padding:0 18px 14px;}
  .step{flex:1;height:5px;border-radius:3px;background:var(--border);}
  .step.done{background:var(--accent);}
  .step.active{background:var(--accent);opacity:.55;}

  /* Card / list row */
  .card{
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
  }
  .row-select{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .row-select.active{border-color:var(--accent);background:var(--accent-soft);}
  .row-select .main{font-weight:700;font-size:15px;}
  .row-select .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .row-select .check{
    width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
    flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  }
  .row-select.active .check{background:var(--accent);border-color:var(--accent);}

  .list-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 2px;
    border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .info .name{font-weight:600;font-size:15px;}
  .list-item .info .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .list-item .acts{display:flex;gap:6px;flex:none;}
  .icon-btn{
    width:32px;height:32px;border-radius:9px;border:1.5px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);cursor:pointer;font-size:14px;
  }
  .icon-btn.danger{color:var(--accent);}
  .icon-btn.disabled{opacity:0.25;pointer-events:none;}

  /* Checklist stepper */
  .item-row{
    display:flex;flex-direction:column;gap:10px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:14px;
    margin-bottom:10px;
    transition:border-color .15s;
  }
  .item-row.qty-active{border-color:var(--success);background:var(--success-soft);}
  .item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .item-row .name{font-weight:700;font-size:15px;}
  .note-toggle{
    flex:none;width:32px;height:32px;border-radius:9px;
    border:1.5px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;cursor:pointer;color:var(--ink-soft);
    -webkit-tap-highlight-color:transparent;
  }
  .note-toggle.has-note{border-color:var(--wood);color:var(--wood);background:#FBF4E8;}
  .note-preview{
    font-size:13px;color:var(--ink-soft);
    background:rgba(0,0,0,0.02);border-radius:10px;padding:8px 10px;
    display:flex;align-items:flex-start;gap:6px;
  }
  .note-preview b{color:var(--ink);font-weight:700;}
  .note-input{
    width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);
    font-family:'Heebo';font-size:13.5px;background:var(--surface);color:var(--ink);
  }
  .note-input:focus{outline:none;border-color:var(--wood);}
  .item-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .unit-toggle{display:flex;gap:6px;flex:1;}
  .unit-btn{
    flex:1;text-align:center;padding:8px 4px;border-radius:10px;
    border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);
    font-size:12.5px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .unit-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .stepper{display:flex;align-items:center;gap:2px;flex:none;}
  .stepper button{
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--accent);
    background:var(--surface);color:var(--accent);
    font-size:20px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .stepper button:active{background:var(--accent-soft);}
  .stepper .qty{
    width:38px;text-align:center;font-size:18px;font-weight:700;
    border:none;background:transparent;color:var(--ink);
  }

  /* Sticky footer bar */
  .footer-bar{
    position:sticky;bottom:0;z-index:15;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;
    max-width:480px;margin:0 auto;width:100%;
  }
  .footer-bar .count{font-size:13px;color:var(--ink-soft);flex:none;white-space:nowrap;}
  .footer-bar .count b{color:var(--ink);font-family:'JetBrains Mono';}

  /* Form fields */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
    font-family:'Heebo';font-size:15px;background:var(--surface);color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}

  .icon-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .reorder-panel{
    background:var(--bg);border-radius:12px;padding:12px;
    margin:-2px 0 10px;
  }
  .reorder-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn-chip{
    padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .btn-chip.disabled{opacity:0.3;pointer-events:none;}
  .pos-input{
    width:48px;text-align:center;padding:8px 4px;border-radius:8px;
    border:1.5px solid var(--border);font-size:14px;background:var(--surface);color:var(--ink);
  }

  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
  }
  .empty .e-icon{font-size:36px;margin-bottom:10px;}
  .empty .e-title{font-weight:700;color:var(--ink);margin-bottom:4px;}
  .empty .e-sub{font-size:13px;}

  .fab-add{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px;border-radius:14px;
    border:1.5px dashed var(--border);
    background:transparent;color:var(--accent);font-weight:700;font-size:15px;
    cursor:pointer;margin-top:4px;
  }

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{
    flex:1;text-align:center;padding:10px;border-radius:12px;
    font-weight:700;font-size:14px;cursor:pointer;
    background:var(--bg);color:var(--ink-soft);
  }
  .tab.active{background:var(--accent);color:#fff;}

  /* Ticket / preview */
  .ticket-wrap{padding-top:6px;}
  .ticket{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:26px 20px 24px;
    box-shadow:0 8px 24px rgba(33,29,26,0.08);
  }
  .ticket::before{
    content:'';
    position:absolute;top:-1px;right:0;left:0;height:12px;
    background-image:radial-gradient(circle 6px at 12px 0, var(--bg) 6px, transparent 7px);
    background-repeat:repeat-x;
    background-position:top;
    background-size:24px 12px;
  }
  .stamp{
    position:absolute; top:22px; left:18px;
    border:3px solid var(--accent);
    color:var(--accent);
    font-family:'Rubik';font-weight:800;font-size:12.5px;
    padding:6px 10px;border-radius:8px;
    transform:rotate(-9deg);
    opacity:0.9;
    white-space:nowrap;
  }
  .ticket .t-head{font-size:14px;line-height:1.7;margin-bottom:14px;padding-left:70px;}
  .ticket .t-head b{font-weight:700;}
  .ticket .t-item{border-bottom:1px dashed var(--border);padding:9px 0;}
  .ticket .t-item:last-child{border-bottom:none;}
  .ticket .t-line{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;}
  .ticket .t-line .pname{font-weight:600;}
  .ticket .t-line .pqty{font-family:'JetBrains Mono';font-weight:700;white-space:nowrap;color:var(--accent-dark);}
  .ticket .t-note{font-size:12.5px;color:var(--ink-soft);padding-top:5px;}
  .ticket .t-note b{color:var(--ink);}
  .ticket .t-foot{margin-top:16px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

  .wa-btn{
    background:#25D366;color:#fff;
  }
  .err-banner{
    background:#FDEDEE;color:var(--accent-dark);
    padding:10px 16px;font-size:13px;font-weight:600;text-align:center;
    border-bottom:1px solid var(--accent-soft);
  }
  .ok-banner{
    background:var(--success-soft);color:var(--success);
    padding:10px 16px;font-size:13px;font-weight:600;text-align:center;
    border-bottom:1px solid var(--success);
  }
</style>
</head>
<body>
<div id="app" class="app-shell"></div>

<script>
/* ================= Supabase config =================
   1. Create a free project at https://supabase.com
   2. Run the accompanying supabase-schema.sql in the SQL editor
   3. Project Settings → API → copy the Project URL and the anon public key below
*/
const SUPABASE_URL = 'https://fqcdpwgfjwmamtfxddwa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxY2Rwd2dmandtYW10ZnhkZHdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDQ3MTAsImV4cCI6MjEwMDI4MDcxMH0.pvzUHZpVlGJ3rBYgkpHL3OiT64gske6ASNckIjuedCs';

const isConfigured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
const sb = isConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const APP_PASSCODE = '1122334455!';

/* ---------------- Data ---------------- */
let state = {
  screen: 'home',
  unlocked: false,
  passcodeError: false,
  configured: isConfigured,
  loading: true,
  errorMsg: null,

  suppliers: [],
  branches: [],

  adminTab: 'suppliers',
  editingSupplierId: null,
  editingProductSupplierId: null,
  editingProductId: null,
  editingBranchId: null,

  importSupplierId: null,
  importRows: null,       // parsed rows waiting for confirmation: [{name, include}]
  importFileName: null,
  importing: false,
  productSearch: '',
  checklistSearch: '',
  expandedReorderId: null,

  order: { branchId:null, date:'', noDate:false, supplierId:null, qty:{}, unit:{}, notes:{}, noteOpen:{} },
  orders: [],
  historyOrderId: null,
  sendOrderId: null,
  confirming: false,
  successMsg: null,
  copiedOrderId: null,
};

const HE_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const uid = (p) => p + '_' + Date.now() + '_' + Math.floor(Math.random()*10000);

function findSupplier(id){ return state.suppliers.find(s=>s.id===id); }
function findBranch(id){ return state.branches.find(b=>b.id===id); }

function normalizePhone(phone){
  let digits = (phone||'').replace(/\D/g,'');
  if(digits.startsWith('0')) digits = '972' + digits.slice(1);
  else if(!digits.startsWith('972')) digits = '972' + digits;
  return digits;
}
function formatDateHe(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return HE_DAYS[d.getDay()] + ' (' + dd + '.' + mm + ')';
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateLabel(dateVal, noDateVal){
  return noDateVal ? 'ללא תאריך אספקה מוגדר' : formatDateHe(dateVal);
}
function formatCreatedAt(iso){
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return dd+'.'+mm+'.'+d.getFullYear()+' · '+hh+':'+mi;
}

function showError(msg){
  state.errorMsg = msg;
  render();
  setTimeout(()=>{ if(state.errorMsg===msg){ state.errorMsg=null; render(); } }, 5000);
}
function showSuccess(msg){
  state.successMsg = msg;
  render();
  setTimeout(()=>{ if(state.successMsg===msg){ state.successMsg=null; render(); } }, 3000);
}

function mapOrderRow(o){
  return {
    id: o.id,
    branchId: o.branch_id,
    supplierId: o.supplier_id,
    date: o.delivery_date,
    noDate: !!o.no_date,
    items: o.items || [],
    sent: !!o.sent,
    createdAt: o.created_at,
  };
}

async function loadAllData(){
  state.loading = true; render();
  try{
    const [branchesRes, suppliersRes, productsRes, ordersRes] = await Promise.all([
      sb.from('branches').select('*').order('name'),
      sb.from('suppliers').select('*').order('name'),
      sb.from('products').select('*').order('sort_order', { ascending:true, nullsFirst:false }),
      sb.from('orders').select('*').order('created_at', { ascending:false }),
    ]);
    [branchesRes, suppliersRes, productsRes, ordersRes].forEach(r => { if(r.error) throw r.error; });

    state.branches = branchesRes.data;
    state.suppliers = suppliersRes.data.map(s => ({
      id: s.id, name: s.name, contact: s.contact, phone: s.phone,
      products: productsRes.data
        .filter(p => p.supplier_id === s.id)
        .map(p => ({ id: p.id, name: p.name, sortOrder: p.sort_order }))
        .sort((a,b) => (a.sortOrder ?? 999999) - (b.sortOrder ?? 999999)),
    }));
    state.orders = ordersRes.data.map(mapOrderRow);
  }catch(err){
    state.errorMsg = 'שגיאה בטעינת הנתונים מ-Supabase: ' + (err.message || err);
  }
  state.loading = false;
  render();
}

/* ---------------- Nav ---------------- */
function goTo(screen){ state.screen = screen; render(); window.scrollTo(0,0); }
function goHome(){
  state.order = { branchId:null, date:'', noDate:false, supplierId:null, qty:{}, unit:{}, notes:{}, noteOpen:{} };
  goTo('home');
}
function startNewOrder(){
  state.order = { branchId:null, date:'', noDate:false, supplierId:null, qty:{}, unit:{}, notes:{}, noteOpen:{} };
  goTo('order-branch-date');
}

/* ---------------- Order flow actions ---------------- */
function selectBranch(id){ state.order.branchId = id; render(); }
function setOrderDate(val){ state.order.date = val; render(); }
function toggleNoDate(){
  state.order.noDate = !state.order.noDate;
  if(state.order.noDate) state.order.date = '';
  render();
}
function orderStep1Ready(){ return !!state.order.branchId && (!!state.order.date || state.order.noDate); }
function orderStep1Continue(){
  if(!orderStep1Ready()) return;
  // if a supplier is already set (e.g. duplicating a past order) skip straight to the checklist
  if(state.order.supplierId) goTo('order-checklist'); else goTo('order-supplier');
}
function selectSupplierForOrder(id){
  state.order.supplierId = id;
  state.order.qty = {};
  state.order.unit = {};
  state.order.notes = {};
  state.order.noteOpen = {};
  state.checklistSearch = '';
  goTo('order-checklist');
}
function changeQty(pid, delta){
  const cur = state.order.qty[pid] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.order.qty[pid]; else state.order.qty[pid] = next;
  render();
}
function setQtyManual(pid, val){
  const n = Math.max(0, parseInt(val||'0',10) || 0);
  if(n === 0) delete state.order.qty[pid]; else state.order.qty[pid] = n;
  render();
}
function getUnit(pid){
  return (state.order.unit && state.order.unit[pid]) || 'יחידות';
}
function setUnit(pid, unit){
  state.order.unit = state.order.unit || {};
  state.order.unit[pid] = unit;
  render();
}
function openNoteEditor(pid){
  state.order.noteOpen = state.order.noteOpen || {};
  state.order.noteOpen[pid] = !state.order.noteOpen[pid];
  render();
}
function setNote(pid, val){
  state.order.notes = state.order.notes || {};
  const trimmed = val.trim();
  if(trimmed) state.order.notes[pid] = trimmed; else delete state.order.notes[pid];
  render();
}
function selectedCount(){
  return Object.values(state.order.qty).filter(q=>q>0).length;
}
function goToConfirm(){ if(selectedCount()>0) goTo('order-confirm'); }

function buildItemsFromCurrentOrder(){
  const supplier = findSupplier(state.order.supplierId);
  return supplier.products
    .filter(p => (state.order.qty[p.id]||0) > 0)
    .map(p => ({
      productId: p.id,
      name: p.name,
      unit: getUnit(p.id),
      qty: state.order.qty[p.id],
      note: (state.order.notes && state.order.notes[p.id]) || null,
    }));
}
function buildMessageForOrder(order){
  const branch = findBranch(order.branchId);
  const lines = [];
  const head = order.noDate
    ? 'היי, הזמנה עבור קצביית ' + (branch?branch.name:'') + ':'
    : 'היי, הזמנה ליום ' + formatDateHe(order.date) + ' עבור קצביית ' + (branch?branch.name:'') + ':';
  lines.push(head);
  order.items.forEach(it=>{
    let line = '- ' + it.qty + ' ' + it.unit + ' ' + it.name;
    if(it.note) line += ' — *' + it.note + '*'; // WhatsApp bold syntax
    lines.push(line);
  });
  return lines.join('\n');
}
function buildMessage(){
  // preview of the in-progress order, before it has been saved as a record
  return buildMessageForOrder({
    branchId: state.order.branchId,
    date: state.order.date,
    noDate: state.order.noDate,
    items: buildItemsFromCurrentOrder(),
  });
}

async function confirmOrder(){
  const items = buildItemsFromCurrentOrder();
  if(items.length===0) return;
  state.confirming = true; render();
  try{
    const { data, error } = await sb.from('orders').insert({
      branch_id: state.order.branchId,
      supplier_id: state.order.supplierId,
      delivery_date: state.order.noDate ? null : state.order.date,
      no_date: !!state.order.noDate,
      items,
      sent: false,
    }).select().single();
    if(error) throw error;
    const record = mapOrderRow(data);
    state.orders.unshift(record);
    state.sendOrderId = record.id;
    state.confirming = false;
    goTo('order-send');
  }catch(err){
    state.confirming = false;
    showError('שגיאה בשמירת ההזמנה: ' + err.message);
    render();
  }
}

function sendToContact(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  const supplier = findSupplier(order.supplierId);
  if(!supplier || !supplier.phone) return;
  const phone = normalizePhone(supplier.phone);
  const text = encodeURIComponent(buildMessageForOrder(order));
  window.open('https://wa.me/' + phone + '?text=' + text, '_blank');
  markOrderSent(orderId);
}
function sendToGroup(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  const text = encodeURIComponent(buildMessageForOrder(order));
  // no phone number -> WhatsApp opens its own chat/group picker
  window.open('https://wa.me/?text=' + text, '_blank');
  markOrderSent(orderId);
}
async function copyOrderText(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  const text = buildMessageForOrder(order);
  try{
    await navigator.clipboard.writeText(text);
    markCopied(orderId);
  }catch(err){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      markCopied(orderId);
    }catch(e2){
      showError('ההעתקה נכשלה — אפשר לסמן את הטקסט למעלה ולהעתיק ידנית');
    }
  }
  markOrderSent(orderId);
}
function markCopied(orderId){
  state.copiedOrderId = orderId;
  showSuccess('ההזמנה הועתקה');
  setTimeout(()=>{ if(state.copiedOrderId===orderId){ state.copiedOrderId = null; render(); } }, 2200);
}
async function markOrderSent(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order || order.sent){ render(); return; }
  order.sent = true;
  render();
  try{
    const { error } = await sb.from('orders').update({ sent:true }).eq('id', orderId);
    if(error) throw error;
  }catch(err){
    showError('הפעולה בוצעה, אך עדכון הסטטוס בהיסטוריה נכשל: ' + err.message);
  }
}

function nextSortOrder(supplier){
  return supplier.products.length
    ? Math.max(...supplier.products.map(p => p.sortOrder || 0)) + 1
    : 1;

async function persistProductOrder(supplier){
  try{
    const rows = supplier.products.map(p => ({ id:p.id, supplier_id:supplier.id, name:p.name, sort_order:p.sortOrder }));
    const { error } = await sb.from('products').upsert(rows);
    if(error) throw error;
  }catch(err){
    showError('שגיאה בשמירת הסדר: ' + err.message);
  }
}
function reorderTo(supplierId, productId, newIndex){
  const supplier = findSupplier(supplierId);
  const idx = supplier.products.findIndex(p=>p.id===productId);
  if(idx===-1) return;
  newIndex = Math.max(0, Math.min(newIndex, supplier.products.length-1));
  if(newIndex===idx) return;
  const [item] = supplier.products.splice(idx,1);
  supplier.products.splice(newIndex,0,item);
  supplier.products.forEach((p,i)=> p.sortOrder = i+1);
  render();
  persistProductOrder(supplier);
}
function moveProduct(supplierId, productId, direction){
  const supplier = findSupplier(supplierId);
  const idx = supplier.products.findIndex(p=>p.id===productId);
  if(idx===-1) return;
  reorderTo(supplierId, productId, idx + direction);
}
function moveToTop(supplierId, productId){ reorderTo(supplierId, productId, 0); }
function moveToBottom(supplierId, productId){
  const supplier = findSupplier(supplierId);
  reorderTo(supplierId, productId, supplier.products.length - 1);
}
function moveToPosition(supplierId, productId, val){
  const n = parseInt(val, 10);
  if(!n || isNaN(n)){ render(); return; }
  reorderTo(supplierId, productId, n - 1);
}
function sortProductsAlphabetically(supplierId){
  const supplier = findSupplier(supplierId);
  supplier.products.sort((a,b) => a.name.localeCompare(b.name, 'he'));
  supplier.products.forEach((p,i) => p.sortOrder = i+1);
  render();
  persistProductOrder(supplier);
}

function setImportSupplier(id){ state.importSupplierId = id; state.importRows = null; state.importFileName = null; render(); }

function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  state.importFileName = file.name;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
      if(!rows.length){ showError('הקובץ ריק'); return; }

      // detect a header row (if the first cell isn't a real product name like "שם")
      const firstCell = String(rows[0][0] || '').trim();
      const looksLikeHeader = ['שם','שם מוצר','מוצר','product','name'].includes(firstCell.toLowerCase());
      const dataRows = looksLikeHeader ? rows.slice(1) : rows;

      const supplier = findSupplier(state.importSupplierId);
      const existingNames = new Set(supplier.products.map(p => p.name.trim().toLowerCase()));
      const seenInFile = new Set();

      const parsed = dataRows
        .map(r => String(r[0]||'').trim())
        .filter(name => name)
        .map(name => {
          const key = name.toLowerCase();
          const duplicate = existingNames.has(key) || seenInFile.has(key);
          seenInFile.add(key);
          return { name, duplicate, include: !duplicate };
        });

      if(!parsed.length){ showError('לא נמצאו שורות מוצר תקינות בקובץ'); return; }
      state.importRows = parsed;
      render();
    }catch(err){
      showError('שגיאה בקריאת הקובץ: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function toggleImportRow(idx){
  state.importRows[idx].include = !state.importRows[idx].include;
  render();
}
function cancelImport(){
  state.importRows = null; state.importFileName = null;
  render();
}
async function confirmImport(){
  const supplier = findSupplier(state.importSupplierId);
  const rowsToImport = state.importRows.filter(r=>r.include);
  if(!supplier || rowsToImport.length===0) return;
  state.importing = true; render();
  try{
    let nextOrder = nextSortOrder(supplier);
    const payload = rowsToImport.map(r => ({ supplier_id: supplier.id, name: r.name, sort_order: nextOrder++ }));
    const { data, error } = await sb.from('products').insert(payload).select();
    if(error) throw error;
    data.forEach(p => supplier.products.push({ id:p.id, name:p.name, sortOrder:p.sort_order }));
    supplier.products.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
    state.importRows = null;
    state.importFileName = null;
    state.importing = false;
    state.editingProductSupplierId = supplier.id;
    goTo('admin-products');
  }catch(err){
    state.importing = false;
    showError('שגיאה בייבוא המוצרים: ' + err.message);
  }
}

function exportToExcel(){
  try{
    const wb = XLSX.utils.book_new();

    const supplierRows = [['ספק','איש קשר','טלפון','מוצר']];
    state.suppliers.forEach(s=>{
      if(s.products.length===0){
        supplierRows.push([s.name, s.contact||'', s.phone, '']);
      } else {
        s.products.forEach(p=> supplierRows.push([s.name, s.contact||'', s.phone, p.name]));
      }
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(supplierRows), 'ספקים ומוצרים');

    const branchRows = [['סניף']].concat(state.branches.map(b=>[b.name]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(branchRows), 'סניפים');

    const orderRows = [['תאריך אספקה','סניף','ספק','מוצר','יחידת מידה','כמות','הערה','נשלח בתאריך']];
    state.orders.forEach(o=>{
      const branch = findBranch(o.branchId);
      const supplier = findSupplier(o.supplierId);
      const dateCol = o.noDate ? 'ללא תאריך' : (o.date || '');
      o.items.forEach(it=>{
        orderRows.push([dateCol, branch?branch.name:'', supplier?supplier.name:'', it.name, it.unit, it.qty, it.note||'', formatCreatedAt(o.createdAt)]);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(orderRows), 'היסטוריית הזמנות');

    const stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'נתוני-קצביה-' + stamp + '.xlsx');
  }catch(err){
    showError('שגיאה בייצוא לאקסל: ' + err.message);
  }
}

/* --- Admin: Products of a supplier --- */
function renderProductRows(supplier, search){
  const term = (search||'').trim().toLowerCase();
  const filtered = term ? supplier.products.filter(p => p.name.toLowerCase().includes(term)) : supplier.products;

  if(filtered.length===0){
    return term
      ? `<div class="empty"><div class="e-icon">🔍</div><div class="e-title">לא נמצאו מוצרים תואמים</div></div>`
      : `<div class="empty"><div class="e-icon">📦</div><div class="e-title">אין מוצרים לספק זה</div><div class="e-sub">הוסף מוצר ראשון</div></div>`;
  }

  const last = supplier.products.length - 1;
  return filtered.map(p => {
    const idx = supplier.products.findIndex(x=>x.id===p.id);
    const expanded = state.expandedReorderId === p.id;
    let panel = '';
    if(expanded){
      panel = `
      <div class="reorder-panel">
        <div class="reorder-row">
          <button class="btn-chip ${idx===0?'disabled':''}" onclick="moveToTop('${supplier.id}','${p.id}')">⤒ לראש</button>
          <button class="btn-chip ${idx===0?'disabled':''}" onclick="moveProduct('${supplier.id}','${p.id}',-1)">▲</button>
          <button class="btn-chip ${idx===last?'disabled':''}" onclick="moveProduct('${supplier.id}','${p.id}',1)">▼</button>
          <button class="btn-chip ${idx===last?'disabled':''}" onclick="moveToBottom('${supplier.id}','${p.id}')">⤓ לסוף</button>
        </div>
        <div class="reorder-row" style="margin-top:8px">
          <label style="font-size:12.5px;color:var(--ink-soft)">מיקום:</label>
          <input class="pos-input mono" type="text" inputmode="numeric" value="${idx+1}" onchange="moveToPosition('${supplier.id}','${p.id}', this.value)">
          <span style="font-size:12px;color:var(--ink-soft)">מתוך ${supplier.products.length}</span>
        </div>
      </div>`;
    }
    return `
    <div class="list-item">
      <div class="info">
        <div class="name">${p.name}</div>
      </div>
      <div class="acts">
        <div class="icon-btn ${expanded?'active':''}" onclick="toggleReorderPanel('${p.id}')">↕</div>
        <div class="icon-btn" onclick="openProductForm('${supplier.id}','${p.id}')">✎</div>
        <div class="icon-btn danger" onclick="deleteProduct('${supplier.id}','${p.id}')">🗑</div>
      </div>
    </div>${panel}`;
  }).join('');
}

/* --- Order flow --- */
function stepIndicator(active){
  let html = '<div class="steps">';
  for(let i=4;i>=1;i--){
    html += `<div class="step ${i<active?'done':(i===active?'active':'')}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderChecklistRows(supplier, search){
  const UNITS = ['יחידות','ארגז','קרטון'];
  const term = (search||'').trim().toLowerCase();
  const filtered = term ? supplier.products.filter(p => p.name.toLowerCase().includes(term)) : supplier.products;

  if(filtered.length===0){
    return term
      ? `<div class="empty"><div class="e-icon">🔍</div><div class="e-title">לא נמצאו מוצרים תואמים</div></div>`
      : `<div class="empty"><div class="e-icon">📦</div><div class="e-title">לספק זה אין מוצרים מוגדרים</div></div>`;
  }

  return filtered.map(p => {
    const q = state.order.qty[p.id] || 0;
    const unit = getUnit(p.id);
    const note = (state.order.notes && state.order.notes[p.id]) || '';
    const noteOpen = !!(state.order.noteOpen && state.order.noteOpen[p.id]) || !!note;
    const unitButtons = UNITS.map(u => `<button class="unit-btn ${unit===u?'active':''}" onclick="setUnit('${p.id}','${u}')">${u}</button>`).join('');
    let noteHtml = '';
    if(noteOpen){
      noteHtml = `<input class="note-input" type="text" placeholder="הערה על המוצר... (תופיע מודגשת בהודעה)" value="${note}" onchange="setNote('${p.id}', this.value)">`;
    }
    return `
    <div class="item-row ${q>0?'qty-active':''}">
      <div class="item-top">
        <div class="name">${p.name}</div>
        <div class="note-toggle ${note?'has-note':''}" onclick="openNoteEditor('${p.id}')">📝</div>
      </div>
      ${noteHtml}
      <div class="item-bottom">
        <div class="unit-toggle">${unitButtons}</div>
        <div class="stepper">
          <button onclick="changeQty('${p.id}',-1)">−</button>
          <input class="qty mono" type="text" inputmode="numeric" value="${q}" onchange="setQtyManual('${p.id}', this.value)">
          <button onclick="changeQty('${p.id}',1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

  state.checklistSearch = val;

  const container = document.getElementById('checklist-items-container');

  </div>`;
}

function screenOrderHistory(){
  const rows = state.orders.map(o => {
    const branch = findBranch(o.branchId);
    const supplier = findSupplier(o.supplierId);
    const statusBadge = o.sent
      ? `<span style="color:var(--success)">✓ נשלח</span>`
      : `<span style="color:var(--wood)">● ממתין לשליחה</span>`;
    return `
    <div class="list-item">
      <div class="info" style="cursor:pointer" onclick="openHistoryDetail('${o.id}')">
        <div class="name">${branch ? branch.name : '—'} · ${supplier ? supplier.name : '—'}</div>
        <div class="meta">${dateLabel(o.date, o.noDate)} · ${o.items.length} פריטים · ${statusBadge} · ${formatCreatedAt(o.createdAt)}</div>
      </div>
      <div class="acts">
        <div class="icon-btn" title="שליחה" onclick="state.sendOrderId='${o.id}'; goTo('order-send')">📤</div>
        <div class="icon-btn" title="שכפול" onclick="duplicateOrder('${o.id}')">⤴</div>
      </div>
    </div>`;
  }).join('');
  return `
  ${topbar('היסטוריית הזמנות', state.orders.length + ' הזמנות שאושרו', "goHome()")}
  <div class="content">
    <div class="card">
      ${rows || `<div class="empty"><div class="e-icon">🕒</div><div class="e-title">עדיין לא אושרו הזמנות</div><div class="e-sub">הזמנות שתאשר יופיעו כאן</div></div>`}
    </div>
  </div>`;
}

function screenOrderHistoryDetail(){
  const order = state.orders.find(o=>o.id===state.historyOrderId);
  if(!order){
    return `${topbar('פרטי הזמנה', null, "goTo('order-history')")}
    <div class="content"><div class="empty"><div class="e-icon">🕒</div><div class="e-title">ההזמנה לא נמצאה</div></div></div>`;
  }
  const branch = findBranch(order.branchId);
  const supplier = findSupplier(order.supplierId);
  const lines = renderTicketLines(order.items);
  const head = order.noDate
    ? 'היי, הזמנה עבור קצביית <b>'+(branch?branch.name:'—')+'</b>, מול <b>'+(supplier?supplier.name:'—')+'</b>:'
    : 'היי, הזמנה ליום <b>'+formatDateHe(order.date)+'</b><br>עבור קצביית <b>'+(branch?branch.name:'—')+'</b>, מול <b>'+(supplier?supplier.name:'—')+'</b>:';
  return `
  ${topbar('פרטי הזמנה', formatCreatedAt(order.createdAt), "goTo('order-history')")}
  <div class="content">
    <div class="ticket-wrap">
      <div class="ticket">
        <div class="stamp">${order.sent ? 'נשלח' : 'מאושר'}</div>
        <div class="t-head">${head}</div>
        ${lines}
      </div>
    </div>
    <button class="btn wa-btn btn-block" style="margin-top:16px" onclick="state.sendOrderId='${order.id}'; goTo('order-send')">📤 שליחת ההזמנה</button>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-secondary" style="flex:1" onclick="deleteHistoryOrder('${order.id}')">מחיקה</button>
      <button class="btn btn-secondary" style="flex:1" onclick="duplicateOrder('${order.id}')">שכפול הזמנה</button>
    </div>
  </div>`;
}

/* ---------------- Boot ---------------- */
function render(){
  const banner = (state.errorMsg ? `<div class="err-banner">${state.errorMsg}</div>` : '')
    + (state.successMsg ? `<div class="ok-banner">${state.successMsg}</div>` : '');
  document.getElementById('app').innerHTML = banner + renderScreen();
}
if(state.configured){ state.loading = false; } // actual load is kicked off from checkPasscode() once unlocked
render();
</script>
</body>
</html>
